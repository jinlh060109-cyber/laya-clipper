[project]
name = "clipper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "laya",
    "whisperx",
    "pyyaml",
    "httpx",
    "anthropic>=1",
]

[project.optional-dependencies]
dev = ["pytest", "playwright"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.pytest.ini_options]
markers = ["model: loads the real Laya checkpoint; deselected by default",
           "e2e: drives the real app in a browser with real models; deselected by default"]
addopts = "-m 'not model and not e2e'"
